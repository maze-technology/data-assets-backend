# DISABLED: GitLab CI is the primary image publish path (see .gitlab-ci.yml →
# infrastructure-base ci/templates/container-publish.gitlab-ci.yml).
# Kept disabled to avoid double-publish to Docker Hub while mirrors sync.
name: Publish

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Only enable temporarily for emergency Hub publishes"
        required: false
        default: "disabled"

jobs:
  disabled:
    name: Disabled (GitLab primary)
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: |
          echo "Publish runs on GitLab CI → \$CI_REGISTRY_IMAGE"
          echo "Re-enable this workflow only for emergency Docker Hub publishes."
          exit 0
